<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1980s Photo Prompts</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1d1b18;--muted:#6f6a62;--line:#e4ded4;--accent:#b4462b;--chip:#efe9df}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15130f;--card:#1f1c17;--ink:#eee8dd;--muted:#a39b8e;--line:#353027;--accent:#e0714f;--chip:#2a261f}}
:root[data-theme=dark]{--bg:#15130f;--card:#1f1c17;--ink:#eee8dd;--muted:#a39b8e;--line:#353027;--accent:#e0714f;--chip:#2a261f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
header{max-width:1280px;margin:0 auto;padding:28px 16px 8px}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input,.bar select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.bar input{flex:1;min-width:200px}
.count{color:var(--muted);font-size:13px}
main{max-width:1280px;margin:0 auto;padding:12px 16px 48px;columns:300px;column-gap:16px}
.card{break-inside:avoid;margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card img{display:block;width:100%;height:auto;background:var(--chip);cursor:zoom-in}
.body{padding:10px 12px 12px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
.chip{background:var(--chip);border-radius:999px;padding:1px 8px}
.heat{color:var(--accent);font-weight:600}
.prompt{font-size:13.5px;white-space:pre-wrap;word-break:break-word;max-height:7.5em;overflow:hidden;position:relative}
.card.open .prompt{max-height:none}
.actions{display:flex;gap:8px;margin-top:8px;font-size:13px}
.actions button,.actions a{font:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--ink);cursor:pointer;text-decoration:none}
.actions button:hover,.actions a:hover{border-color:var(--accent)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#lb img{max-width:94vw;max-height:94vh}
</style>
</head>
<body>
<header>
  <h1>1980s Photo Prompts</h1>
  <p class="sub">Prompts + result images from OpenArt / Civitai, ranked by engagement (likes + 2×bookmarks + shares + comments).</p>
  <div class="bar">
    <input id="q" type="search" placeholder="Filter prompts (e.g. polaroid, flash, tokyo)">
    <select id="sort"><option value="heat">Sort: heat</option><option value="likes">Sort: likes</option><option value="rank">Sort: rank</option></select>
    <select id="src"><option value="">All sources</option><option>openart</option><option>civitai</option></select>
    <span class="count" id="count"></span>
  </div>
</header>
<main id="grid"></main>
<div id="lb"><img alt=""></div>
<script>
const DATA = [{"rank": 1, "source": "openart", "heat": 2, "likes": 0, "bookmarks": 1, "prompt": "Long Soviet police station corridor, mid-1980s.\rNarrow space with low ceiling, worn linoleum floor.\rCold fluorescent lights repeating along the ceiling.\rClosed doors on both sides, identical and anonymous.\rNo windows, no decoration, institutional signage only.\rThe corridor feels endless, silent, and oppressive.\rA sense of movement toward something unavoidable.\rRealistic graphic novel style, cinematic lighting, cold and desaturated color palette, high contrast shadows.", "negative_prompt": "", "model": "kling_omni", "author": "Gianluca Caputo", "post_url": "https://openart.ai/discovery/bEpmwcq0m85L81kKGlRv", "local_image": "images/openart_bEpmwcq0m85L81kKGlRv.webp", "thumb_url": "https://cdn.openart.ai/published/j8f3r2PmZ4Vktg0bhTCk/WJ4z3mI7_ug2u_512.webp", "width": 1168, "height": 880}, {"rank": 2, "source": "openart", "heat": 2, "likes": 0, "bookmarks": 1, "prompt": "The woman's hair in this portrait is long, blonde, and styled in an iconic 1980s big-hair fashion—voluminous and heavily teased for maximum height and drama at the crown. It has a windswept, tousled appearance, with loose, wavy strands flowing outward and downward over her shoulders, creating a sense of movement and fullness. The texture looks slightly frizzy or permed, framing her face boldly while emphasizing the overall glamorous, rock-inspired vibe.", "negative_prompt": "", "model": "gpt_image_1_5", "author": "Michael Anderson", "post_url": "https://openart.ai/discovery/bQO3ZkJA4fmzbTMIUbCo", "local_image": "images/openart_bQO3ZkJA4fmzbTMIUbCo.webp", "thumb_url": "https://cdn.openart.ai/published/6xWGx2cFIkoQkqKcdAop/ExryX2ib_FRqI_512.webp", "width": 1024, "height": 1024}, {"rank": 17, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "Striking a pose with confidence, a glamorous 35-year-old Greek drag queen in a bold zebra-print dress leans against a shiny pink car, exuding an unmistakable retro vibe. Her voluminous, 1980s style blonde hair contrasts with her dramatic makeup, highlighted by vibrant purple eyeshadow and flashy pink earrings. The setting suggests an urban nightlife backdrop, hinting at the allure and excitement of the era. The ensemble is accentuated by a thick black belt adorned with studs, drawing attention to her silhouette, while her legs are accentuated by shiny tights and matching 7 inch stiletto pink heels. The colorful and exuberant style captures the spirit of 1980s fashion, evoking a sense of fun and bold expression.", "negative_prompt": "", "model": "imagen-4.0-generate-001", "author": "Whatchootalkingbout", "post_url": "https://openart.ai/discovery/4yqE6jD21QsOjlTRGKiF", "local_image": "images/openart_4yqE6jD21QsOjlTRGKiF.webp", "thumb_url": "https://cdn.openart.ai/published/UcVVGYre9bB87gXf5lE0/dh12BgVU_GtFb_512.webp", "width": 1280, "height": 896}, {"rank": 18, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "Silhouetted side-profile of a female rock guitarist mid-performance, strong 1980s hard-rock vibe, big teased hair, fitted black leather jacket, high-waisted tight black pants, electric guitar held low, dramatic stage pose, bold rim lighting creating a clean silhouette, dark background filled with a repeating taco pattern rendered as subtle graphic shapes, neon-accented tacos blending into the backdrop, gritty retro rock energy, no visible facial details, no text, high contrast, cinematic lighting", "negative_prompt": "", "model": "nano-banana-2", "author": "Tim Story", "post_url": "https://openart.ai/discovery/tlFwXBVWntZ7tIXM3KQ2", "local_image": "images/openart_tlFwXBVWntZ7tIXM3KQ2.webp", "thumb_url": "https://cdn.openart.ai/published/aoyAEZB8PkT7h5JSYTEp/kYy5Rdn2_t2K1_512.webp", "width": 1024, "height": 1024}, {"rank": 22, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "A photorealistic feminine photo in the style of 1985. The subject has voluminous, permed hair with a lot of height, a classic mid-80s style. She is wearing bold 1980s makeup, including bright blue and pink eyeshadow, heavy pink blush, and vibrant magenta lipstick. She is dressed in a low-cut silk blouse. The background is a soft-focus studio backdrop in muted blue and gray tones with professional studio lighting that highlights the texture of her hair.", "negative_prompt": "", "model": "nano-banana-2", "author": "Brian Barker", "post_url": "https://openart.ai/discovery/n0BxswybrNijS5znSpcK", "local_image": "images/openart_n0BxswybrNijS5znSpcK.webp", "thumb_url": "https://cdn.openart.ai/published/yqcbgl5y5cjcHftEksl4/bgjCP496_H8sH_512.webp", "width": 1200, "height": 896}, {"rank": 29, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "This photograph, taken in a brightly lit classroom, captures a group of 15 young adults, both men and women, posing for a school group photo. The image is slightly faded, indicating it is an older photograph, possibly from the 1980s or 1990s. The background features a large blackboard on the right side with some faint writing, and a window on the left side letting in natural light. \n\nThe group is arranged in three rows: the front row consists of eight people kneeling or sitting, and the back row has seven people standing. The individuals are dressed in casual to semi-casual attire typical of the period, including striped shirts, polo shirts, and jackets. The men have short to medium-length hair, and the women have varying hairstyles, from curly to straight. One man in the front row is wearing sunglasses, and another man in the back row has a mustache. \n\nThe classroom walls are painted white, and there is a fire extinguisher mounted on the wall in the upper right corner. The floor appears to be made of polished tiles. The overall mood of the photograph is cheerful and informal, reflecting a moment of camaraderie among friends or classmates.", "negative_prompt": "", "model": "byteplus_seedream_4", "author": "CHOUKRI Rabi", "post_url": "https://openart.ai/discovery/UkJ1HOwJKekjc3lBWKF7", "local_image": "images/openart_UkJ1HOwJKekjc3lBWKF7.webp", "thumb_url": "https://cdn.openart.ai/published/KDv3m2BwL3OQpisTP0B0/DJxkYFJ5_owRl_512.webp", "width": 4096, "height": 4096}, {"rank": 30, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "@hH3hmhXdfEb7O9ilZQBL In the soft glow of a fading afternoon, a woman draped in a sumptuous red silk dress stands with quiet poise on the polished marble terrace of a sprawling estate. Her hair, styled in a restrained yet sophisticated updo, complements the understated glamour of oversized tortoiseshell sunglasses perched just so atop her nose. The rich crimson fabric glimmers subtly in the delicate diffused light, its smooth texture contrasting with the coarse weave of the nearby linen-covered chaise longue. Her serene, contemplative gaze drifts toward distant gardens, while a gently knotted Hermès silk scarf adds an air of effortless elegance. Encased in a balanced composition framed through a 50mm lens, the scene exudes the tactile intimacy of analog film—visible 35mm grain softening edges, cream-toned highlights merging with deep, muted shadows reminiscent of Kodachrome. This evocative moment channels the quiet luxury and languid confidence characteristic of early 1980s Slim Aarons imagery. —late-70s / early-80s cinematic photograph, authentic film grain.", "negative_prompt": "", "model": "", "author": "Hrithik Chuahan", "post_url": "https://openart.ai/discovery/OvnnVtaejdtUu928x4BP", "local_image": "images/openart_OvnnVtaejdtUu928x4BP.webp", "thumb_url": "https://cdn.openart.ai/published/t55rXBnjrphb6gxY47vr/tJgHPyuf_iG5B_512.webp", "width": 3040, "height": 5504}, {"rank": 31, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "Picture a gorgeous 35-year-old Swiss drag queen with dark eyeshadow, heavy mascara, dark red lipstick, dark red manicured fingernails, very long dark red hair, resplendent in a striking 80s Armani ensemble that fuses bold colors and sharp lines, standing on a vibrant neon-lit city street at dusk. The air is thick with a sense of nostalgia and electric energy as vivid streetlights cast colorful reflections off the wet pavement, enhancing the glam of her outfit. Her hair is styled in a flamboyant 80s fashion, and her expression radiates confidence and fierce individuality. She poses dramatically, one hand on her hip, the other playfully flipping her hair, embodying the spirit of an era. The scene is suffused with a cinematic flair, evoking the glamour and audacity of the 80s in a vibrant, photorealistic style.", "negative_prompt": "", "model": "nano-banana", "author": "Whatchootalkingbout", "post_url": "https://openart.ai/discovery/JhLn4xCn9zB1wLbt9VAO", "local_image": "images/openart_JhLn4xCn9zB1wLbt9VAO.webp", "thumb_url": "https://cdn.openart.ai/published/UcVVGYre9bB87gXf5lE0/7X2OBEiU_dJ_2_512.webp", "width": 1184, "height": 864}, {"rank": 36, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "Make a cool 80s style mtv Music video with a punk female singer singing this song along the edge of a rocky fault line", "negative_prompt": "", "model": "nano-banana-2", "author": "Matt Habecker", "post_url": "https://openart.ai/discovery/LheHSoiqfCTJf0DG3RGN", "local_image": "images/openart_LheHSoiqfCTJf0DG3RGN.webp", "thumb_url": "https://cdn.openart.ai/published/0elt1pczLVmaloZrAY8h/QTCjpimP_ubZj_512.webp", "width": 1200, "height": 896}, {"rank": 37, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "an 80s rock star performing on stage during a concert, from a distance", "negative_prompt": "", "model": "flux2", "author": "James Morrow", "post_url": "https://openart.ai/discovery/lqB2KrN88FitCVF6DKWQ", "local_image": "images/openart_lqB2KrN88FitCVF6DKWQ.webp", "thumb_url": "https://cdn.openart.ai/published/dSBIcTyM8Ed2Xe0Y1H0b/gR_NPrEM_wbbJ_512.webp", "width": 1920, "height": 1920}, {"rank": 41, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "Create a photo of my family with 80s trend in kerala", "negative_prompt": "", "model": "byteplus_seedream_4_5", "author": "VIPIN KUMAR", "post_url": "https://openart.ai/discovery/vwY9IscuF0KAKk0zxTID", "local_image": "images/openart_vwY9IscuF0KAKk0zxTID.webp", "thumb_url": "https://cdn.openart.ai/published/3k4JXH4m5aZnb2wCxNzt/DxVeLZfk_FVBh_512.webp", "width": 2304, "height": 1728}, {"rank": 44, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "80s color film photography of Sophia Eisenhut dressed in a black Jil Sander suit petting a baby fawn while standing near to the viewer in front of a brutalist building by le Corbusier. In the background we can see trapezoidal shaped concrete pillars that support the modernist building Unité d'habitation built by le Corbusier", "negative_prompt": "", "model": "flux2", "author": "Sophia E.", "post_url": "https://openart.ai/discovery/xjRU4X0f9mBJQYTsMeLn", "local_image": "images/openart_xjRU4X0f9mBJQYTsMeLn.webp", "thumb_url": "https://cdn.openart.ai/published/tKnpfM58aJoTvxUP5xco/UGXgkHcx_0b7X_512.webp", "width": 1024, "height": 768}, {"rank": 53, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "This photograph captures a scene featuring four individuals standing in a room with a refrigerator in the background. The focal point is a group of three women and one man, viewed from the back. The woman in the center has long, straight, light brown hair and is wearing a white football jersey with purple and yellow stripes on the shoulders and the number \"10\" prominently displayed in purple. She has a serious expression. To her left, a blonde woman with shoulder-length hair is dressed in a white button-up shirt and is looking slightly to the right with a neutral expression. On the right, a woman with curly brown hair is also wearing a white button-up shirt and is looking directly at the camera with a subtle smile. The man, whose back is mostly to the camera, has short brown hair and is wearing a light brown shirt. The background includes a refrigerator with a slightly open door, revealing some shelves and items inside. The lighting is soft and natural, creating a casual and intimate atmosphere. The image has a warm, slightly nostalgic feel, reminiscent of 1980s or 1990s television or film.", "negative_prompt": "", "model": "flux2", "author": "Wade Wallenstein", "post_url": "https://openart.ai/discovery/DAoGedHnRKva4iaOcPdn", "local_image": "images/openart_DAoGedHnRKva4iaOcPdn.webp", "thumb_url": "https://cdn.openart.ai/published/sBSxJTLYMDOIjnAK7A3G/kkbITy23_8NQD_512.webp", "width": 1024, "height": 768}, {"rank": 55, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "Visualize a muscular 35-year-old Greek drag queen embodying the spirit of the 1980s, her outfit a vibrant collage of bold patterns and bright colors, complete with shoulder pads and a mini skirt which show off her long tined legs and 7 inch stiletto high heel shoes. Her big, voluminous hair radiates confidence, infused with neon hues that catch the light. The room around her is alive with the ambiance of a retro living space, adorned with geometric prints and vintage decor, casting warm, inviting shadows. The sunlight pours through lace-curtained windows, creating a soft, golden glow that enhances the vivid colors of her striking makeup—a perfect blend of electric blue eyeshadow and glossy fuchsia lips. She stands in a playful pose, a hint of nostalgia in her smile, embodying the carefree joy of the era, captured in an incredibly realistic style that brings every detail to life.", "negative_prompt": "", "model": "imagen-4.0-generate-001", "author": "Whatchootalkingbout", "post_url": "https://openart.ai/discovery/zpUfSYr952Pc5Wulr7Wo", "local_image": "images/openart_zpUfSYr952Pc5Wulr7Wo.webp", "thumb_url": "https://cdn.openart.ai/published/UcVVGYre9bB87gXf5lE0/tt7TjqNA_bdUu_512.webp", "width": 1280, "height": 896}, {"rank": 57, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "In a bustling Catalan school environment, a group of adult women wears the same smock pink gingham teacher smock uniform with Peter Pan collar stands confidently at the forefront, smiling warmly at the camera. This color photograph captures a 1985 moment, exuding a sense of teamwork and community that was typical of school settings during the era. The overall mood conveys professionalism mixed with friendly interactions, making it a snapshot of ends 20th century school culture and hair fashion.", "negative_prompt": "", "model": "nano-banana", "author": "Boomboom", "post_url": "https://openart.ai/discovery/4hQWcrIcY3qCIj5uFMxH", "local_image": "images/openart_4hQWcrIcY3qCIj5uFMxH.webp", "thumb_url": "https://cdn.openart.ai/published/rVMZMD4xhKt5EwpgksTK/4lbZkJA5_GTIV_512.webp", "width": 672, "height": 1536}, {"rank": 60, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "The 35-year-old Japanese drag queen's hair in this portrait is long, blonde, and styled in an iconic 1980s big-hair fashion—voluminous and heavily teased for maximum height and drama at the crown. It has a windswept, tousled appearance, with loose, wavy strands flowing outward and downward over her shoulders, creating a sense of movement and fullness. The texture looks slightly frizzy or permed, framing her face boldly while emphasizing the overall glamorous, rock-inspired vibe. She's also wearing dark eyeshadow, eyeliner, and heavy mascara, and dark red lipstick.", "negative_prompt": "", "model": "nano-banana-2", "author": "Whatchootalkingbout", "post_url": "https://openart.ai/discovery/8B189tYjbLgNUtLptd7w", "local_image": "images/openart_8B189tYjbLgNUtLptd7w.webp", "thumb_url": "https://cdn.openart.ai/published/UcVVGYre9bB87gXf5lE0/5YBeCF1B_pS6U_512.webp", "width": 1200, "height": 896}, {"rank": 65, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "Striking a bold pose against a plain white wall, a muscular,  35-year-old Mexican drag queen exudes a vibrant retro aesthetic reminiscent of the 1980s with a playful confidence. Clad in a sky blue bodysuit that hugs the curves, the subject is accessorized with bright pink leg warmers and towering 8 inch stiletto platform heels, emphasizing long, muscular, toned legs. Their voluminous, loose blonde curls frame a makeup look featuring dramatic eye color and glossy lips, enhanced by a matching pink headband and wristbands. The lighting is bright, highlighting the glossy textures of the outfit and the smooth skin, creating a lively, dynamic atmosphere that celebrates flamboyant fashion. Overall, the image radiates energy and a sense of fun, capturing the essence of a glam-inspired moment.", "negative_prompt": "", "model": "imagen-4.0-generate-001", "author": "Whatchootalkingbout", "post_url": "https://openart.ai/discovery/fkPpWYjzU17AW9Cp4iu1", "local_image": "images/openart_fkPpWYjzU17AW9Cp4iu1.webp", "thumb_url": "https://cdn.openart.ai/published/UcVVGYre9bB87gXf5lE0/0Pex5ur6_Hn3S_512.webp", "width": 1024, "height": 1024}, {"rank": 67, "source": "openart", "heat": 0, "likes": 0, "bookmarks": 0, "prompt": "Three 35-year-old drag queens embody a vibrant, retro aesthetic, exuding 1980s vibes in a stylish indoor setting. The drag queen on the left sports voluminous black curls and a form-fitting black dress paired with a striking red bomber jacket and matching 7 inch stiletto knee-high boots, striking a confident pose. The middle drag queen with teased Burnt orange hair, kneels with dramatic flair, dressed in a teal satin jacket over a leopard-print outfit, accentuated by bold makeup and eye-catching accessories, including 7 inch stiletto snake-print platform boots. The third third drag queen, with teased long Dark red hair,  stands tall on the right, showcasing a playful casual look with a vintage graphic tee and tight leather leggings, offset by elaborate belt embellishments and similar  7 inch stiletto red heels. Complemented by the geometric patterns of the carpet and the warm lighting from nearby fixtures, the scene radiates fun and nostalgia, capturing a moment of youthful exuberance and celebration.", "negative_prompt": "", "model": "imagen-3.0-generate-002", "author": "Whatchootalkingbout", "post_url": "https://openart.ai/discovery/cJYlq4MdU4FiRyig5K6L", "local_image": "images/openart_cJYlq4MdU4FiRyig5K6L.webp", "thumb_url": "https://cdn.openart.ai/published/UcVVGYre9bB87gXf5lE0/lLlIPqsF_emNl_512.webp", "width": 1024, "height": 1024}];
const grid = document.getElementById('grid'), q = document.getElementById('q'),
      sortSel = document.getElementById('sort'), src = document.getElementById('src'),
      count = document.getElementById('count'), lb = document.getElementById('lb');
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  const term = q.value.trim().toLowerCase(), s = sortSel.value;
  let rows = DATA.filter(r => (!src.value || r.source===src.value) && (!term || r.prompt.toLowerCase().includes(term)));
  rows.sort((a,b) => s==='rank' ? a.rank-b.rank : (b[s]-a[s]) || a.rank-b.rank);
  count.textContent = rows.length + ' / ' + DATA.length;
  grid.innerHTML = rows.map(r => `
    <article class="card">
      <img loading="lazy" src="${esc(r.local_image||r.thumb_url)}" data-full="${esc(r.local_image||r.thumb_url)}"
           ${r.width&&r.height?`width="${r.width}" height="${r.height}"`:''} alt="">
      <div class="body">
        <div class="meta"><span class="heat">🔥 ${r.heat}</span><span>♥ ${r.likes}</span>${r.bookmarks?`<span>★ ${r.bookmarks}</span>`:''}
          <span class="chip">${esc(r.source)}</span>${r.model?`<span class="chip">${esc(r.model)}</span>`:''}<span>#${r.rank}</span></div>
        <div class="prompt">${esc(r.prompt)}</div>
        <div class="actions"><button data-copy>Copy prompt</button><button data-more>Expand</button>
          <a href="${esc(r.post_url)}" target="_blank" rel="noopener">Source ↗</a></div>
      </div>
    </article>`).join('');
  grid.querySelectorAll('.card').forEach((el,i) => el._row = rows[i]);
}
grid.addEventListener('click', e => {
  const card = e.target.closest('.card'); if(!card) return;
  if(e.target.matches('[data-copy]')){ navigator.clipboard.writeText(card._row.prompt); e.target.textContent='Copied'; setTimeout(()=>e.target.textContent='Copy prompt',1200); }
  else if(e.target.matches('[data-more]')){ card.classList.toggle('open'); e.target.textContent = card.classList.contains('open')?'Collapse':'Expand'; }
  else if(e.target.tagName==='IMG'){ lb.firstElementChild.src = e.target.dataset.full; lb.style.display='flex'; }
});
lb.onclick = () => lb.style.display='none';
[q,sortSel,src].forEach(el => el.addEventListener('input', render));
render();
</script>
</body>
</html>
